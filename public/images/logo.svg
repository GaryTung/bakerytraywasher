<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" fill="none" role="img" aria-label="rollinrackwasher.com">
  <!-- ========== MARK ========== -->
  <g>
    <!-- Base square -->
    <rect x="0" y="0" width="56" height="56" rx="2" fill="#0E4D8C"/>
    <!-- Amber top accent strip -->
    <rect x="0" y="0" width="56" height="3" fill="#F59E0B"/>
    <!-- Geometric chamber bracket (top-left + bottom-right corners) -->
    <path d="M 10 14 L 10 10 L 14 10" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    <path d="M 46 46 L 46 42 L 42 46 L 46 46 Z" fill="#F59E0B" opacity="0"/>
    <path d="M 42 46 L 46 46 L 46 42" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="square"/>
    <!-- Water droplet (the wash) -->
    <path d="M 28 18
             C 28 18, 18 28, 18 36
             C 18 42, 22.5 46, 28 46
             C 33.5 46, 38 42, 38 36
             C 38 28, 28 18, 28 18 Z"
          fill="#FFFFFF"/>
    <!-- Droplet highlight -->
    <ellipse cx="24" cy="32" rx="2.5" ry="4" fill="#0E4D8C" opacity="0.25"/>
  </g>

  <!-- ========== WORDMARK ========== -->
  <g transform="translate(74 0)">
    <!-- Main wordmark "rollinrackwasher.com" -->
    <text x="0" y="32"
          font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
          font-size="22"
          font-weight="600"
          letter-spacing="-1.2"
          fill="#0F172A">rollinrackwasher</text>
    <!-- Amber dot -->
    <circle cx="201" cy="29" r="2.6" fill="#F59E0B"/>
    <text x="207" y="32"
          font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
          font-size="22"
          font-weight="600"
          letter-spacing="-1"
          fill="#0F172A">com</text>

    <!-- Sub-caption -->
    <text x="0" y="52"
          font-family="'Roboto Mono', ui-monospace, monospace"
          font-size="8.5"
          letter-spacing="2.5"
          fill="#64748B">V-TAI · INDUSTRIAL RACK WASHERS</text>
  </g>
</svg>
